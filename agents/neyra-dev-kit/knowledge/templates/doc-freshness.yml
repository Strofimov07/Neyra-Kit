# Doc freshness — code→node trigger (см. docs/knowledge/MEMORY_GRAPH.md §6, Triggers).
# Информационный (non-blocking): на PR, тронувшем mapped-код, печатает узлы канона,
# которые надо обновить. Промоут до блокирующего — добавить `--strict` ниже.
name: Doc freshness (code→node)

on:
  pull_request:
    # ВАЖНО: не сужать этот список догадкой о структуре репозитория.
    # Раньше здесь стояло 'src/**' — директории с таким именем не оказалось ни в
    # одном потребителе, поэтому workflow не срабатывал ни разу с момента установки,
    # и единственный автоматический механизм против устаревания доков молчал.
    #
    # Широкий триггер безопасен: сам check_code_node.py сверяет изменённые файлы
    # с code_to_node в knowledge-map.yml и печатает "no mapped paths touched",
    # если ничего релевантного не тронуто. Шаг информационный, не блокирующий.
    #
    # Сузить до собственных code_to_node-глобов можно — но тогда обязательно
    # проверить, что триггер реально срабатывает, а не совпадает с пустотой.
    paths:
      - '**'

jobs:
  code-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: code→node check (informational)
        run: |
          echo "## Doc freshness — code→node" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 docs/knowledge/check_code_node.py "origin/${{ github.base_ref }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
